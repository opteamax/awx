# Mirrors the stack generated by opteamax/ansible-awx-installer (bootstrap_awx.py, gen_compose_file)
# with a container database. AWX_IMAGE is the installer's "awx-podman" image built from
# Dockerfile.awx on top of the AWX image under test.
name: awx-e2e

services:
    awx_web:
        image: ${AWX_IMAGE:-awx-e2e-podman:new}
        container_name: awx_e2e_web
        user: "0"
        command: /usr/bin/launch_awx_web.sh
        depends_on:
            postgres:
                condition: service_healthy
            receptor:
                condition: service_started
            redis:
                condition: service_started
        ports:
            - "127.0.0.1:${AWX_PORT:-18052}:80"
        env_file:
            - ./awx.env
        environment:
            - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - DATABASE_HOST=postgres
            - DATABASE_NAME=awx
            - DATABASE_USER=awx
            - DATABASE_PORT=5432
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        volumes: &awx_volumes
            - projects:/var/lib/awx/projects
            - receptor_sock:/var/run/receptor
            - ./config/receptor.conf:/etc/receptor/receptor.conf:ro
            - ./config/awx_settings.py:/etc/tower/settings.py:ro
            - ./config/awx_nginx.conf:/etc/nginx/conf.d/awx.conf:ro
            - awx_private:/awxdata

    awx_task:
        image: ${AWX_IMAGE:-awx-e2e-podman:new}
        container_name: awx_e2e_task
        hostname: awx_task
        user: "0"
        privileged: true
        cap_add: [CAP_SYS_ADMIN, CAP_SYS_PTRACE, CAP_NET_ADMIN, CAP_SYS_RESOURCE]
        command: /bin/bash -c "set -e; wait-for-migrations; awx-manage provision_instance --hostname=$${HOSTNAME} --node_type=hybrid; exec supervisord -c /etc/supervisord_task.conf"
        depends_on:
            postgres:
                condition: service_healthy
            receptor:
                condition: service_started
            redis:
                condition: service_started
        env_file:
            - ./awx.env
        environment:
            - AWX_SKIP_MIGRATIONS=1
            - DATABASE_HOST=postgres
            - DATABASE_NAME=awx
            - DATABASE_USER=awx
            - DATABASE_PORT=5432
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        volumes: *awx_volumes

    receptor:
        image: ${AWX_IMAGE:-awx-e2e-podman:new}
        container_name: awx_e2e_receptor
        privileged: true
        cap_add: [CAP_SYS_ADMIN, CAP_SYS_PTRACE, CAP_NET_ADMIN, CAP_SYS_RESOURCE]
        command: receptor --config /etc/receptor/receptor.conf
        volumes:
            - projects:/var/lib/awx/projects
            - receptor_sock:/var/run/receptor
            - ./config/receptor.conf:/etc/receptor/receptor.conf:ro
            - awx_private:/awxdata

    redis:
        image: redis:7-alpine
        container_name: awx_e2e_redis

    postgres:
        image: postgres:16
        container_name: awx_e2e_postgres
        environment:
            - POSTGRES_USER=awx
            - POSTGRES_PASSWORD=e2e-db-password
            - POSTGRES_DB=awx
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U awx"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    projects:
    receptor_sock:
    awx_private:
    postgres:
