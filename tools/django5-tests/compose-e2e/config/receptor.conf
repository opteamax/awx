---
- local-only: null

- log-level: info

- node:
    id: awx_task
    firewallrules:
      - action: reject
        tonode: awx_task
        toservice: control

- control-service:
    service: control
    filename: /var/run/receptor/receptor.sock
    permissions: '0660'

- work-command:
    worktype: local
    command: ansible-runner
    params: worker
    allowruntimeparams: true
