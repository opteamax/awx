# Accepted findings for the image scan in .github/workflows/opteamax-image.yml.
# Every entry names the exact package version (purl) and expires, so a newer
# version or a forgotten entry shows up in the scan again.
vulnerabilities:
  # pip 26.3 (the latest release) vendors pkg_resources from setuptools 70.3.0
  # in pip/_vendor; it is only used by pip itself. The venv has setuptools 84.2.1.
  - id: CVE-2025-47273
    purls: ["pkg:pypi/setuptools@70.3.0"]
    statement: pip 26.3 vendors only pkg_resources of setuptools 70.3.0; the vulnerable PackageIndex is not part of it
    expired_at: 2027-01-31
